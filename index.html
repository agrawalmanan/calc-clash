<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalcClash ⚔️ | Real-Time Calculus Arena</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CSS CDN (Fixes 'daisyui is not defined' error) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
            },
            colors: {
              brand: {
                purple: '#6B46C1',
                blue: '#4299E1',
                pink: '#ED64A6',
                yellow: '#ECC94B',
              },
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-indigo-50 min-h-screen text-slate-800 font-sans selection:bg-brand-pink selection:text-white relative overflow-x-hidden">
    <!-- Soft dot pattern background -->
    <div
      class="fixed inset-0 opacity-[0.04] pointer-events-none z-0"
      style="background-image: radial-gradient(#000 1.5px, transparent 1.5px); background-size: 28px 28px;"
    ></div>

    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CalcClash ⚔️ | Real-Time Calculus Arena</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

        <script>
          tailwind.config = {
            theme: {
              extend: {
                fontFamily: { sans: ['Nunito', 'sans-serif'] },
                colors: {
                  brand: {
                    purple: '#6B46C1',
                    blue: '#4299E1',
                    pink: '#ED64A6',
                    yellow: '#ECC94B',
                  },
                },
              },
            },
          };
        </script>
      </head>

      <body class="bg-indigo-50/80 min-h-screen text-slate-800 font-sans selection:bg-brand-pink selection:text-white relative overflow-x-hidden">
        
        <!-- 🎨 SVG Grain Noise Definition for Illustrations -->
        <svg style="display: none;">
          <defs>
            <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
              <feColorMatrix type="saturate" values="0" />
              <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
            </filter>
          </defs>
        </svg>

        <!-- Background Grid Pattern -->
        <div
          class="fixed inset-0 opacity-[0.05] pointer-events-none z-0"
          style="background-image: radial-gradient(#6B46C1 1.5px, transparent 1.5px); background-size: 24px 28px;"
        ></div>

        <div id="root" class="relative z-10"></div>
        <script type="module" src="/src/main.jsx"></script>
      </body>
    </html>
    <!-- React root -->
    <div id="root" class="relative z-10"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
